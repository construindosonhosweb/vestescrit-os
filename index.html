<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171717" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="VESTES — Loja de moda em Rio Branco, Acre. Roupas, calçados e acessórios para todos os estilos." />
    <title>VESTES — Moda em Rio Branco</title>
    <style>
      html,body,#root{margin:0;min-height:100%;width:100%;}
      body{background:#faf9f7;}
      .app-loading{min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box;font-family:Arial,sans-serif;color:#171717;text-align:center;}
      .app-loading-box{max-width:360px;width:100%;}
      .app-loading-brand{font-size:30px;font-weight:800;letter-spacing:-1px;}
      .app-loading-brand span{color:#9b5c45;}
      .app-loading-text{color:#666;font-size:14px;line-height:1.6;margin-top:12px;}
      .app-loading-spinner{width:28px;height:28px;border:3px solid #ddd;border-top-color:#9b5c45;border-radius:50%;margin:22px auto;animation:vspin .8s linear infinite;}
      @keyframes vspin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading" role="status" aria-live="polite">
        <div class="app-loading-box">
          <div class="app-loading-brand">VESTES<span>!</span></div>
          <div class="app-loading-spinner"></div>
          <div class="app-loading-text">Carregando a loja…</div>
        </div>
      </div>
    </div>
    <noscript>
      <div style="padding:40px 20px;font-family:Arial,sans-serif;text-align:center">Ative o JavaScript no navegador para acessar a VESTES.</div>
    </noscript>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
